[project]
name = "langgraph-entrainement"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mouad Aguelloul", email = "aguelloulmouad@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.9",
